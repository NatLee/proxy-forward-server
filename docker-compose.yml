services:

  # OpenVPN 客戶端
  openvpn:
    image: alpine:latest
    container_name: pi-openvpn-client
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./openvpn/client.ovpn:/etc/openvpn/client.conf
    command: >
      /bin/sh -c "apk add --no-cache openvpn && openvpn --config /etc/openvpn/client.conf"

  # SSH 反向通道建立者
  tunnel:
    build: ./tunnel
    container_name: pi-tunnel-worker
    restart: always
    network_mode: "service:openvpn"
    depends_on:
      - openvpn
    volumes:
      - ./keys/key-to-aws.pem:/key.pem:ro
    command: >
      /bin/sh -c " sleep 10 && autossh -M 20000 -N \ -o 'StrictHostKeyChecking no' \ -o 'ExitOnForwardFailure yes' \ -R 2080:127.0.0.1:1080 \ -i /key.pem \ ubuntu@172.31.67.145"

  # HTTP/SOCKS4/SOCKS5 代理服務器 (pproxy)
  proxy:
    build: ./proxy
    container_name: pi-pproxy
    restart: always
    network_mode: "service:openvpn"
    tty: true
    stdin_open: true
    depends_on:
      - openvpn
