services:

# 0. OpenVPN 客戶端
  openvpn:
    image: alpine:latest
    container_name: pi-openvpn-client
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./openvpn/client.ovpn:/etc/openvpn/client.conf
    command: >
      /bin/sh -c "apk add --no-cache openvpn && openvpn --config /etc/openvpn/client.conf"

  # 1. HTTP 代理伺服器 (用 tinyproxy)
  proxy:
      build: ./proxy  # <-- 使用本地 Dockerfile
      container_name: pi-proxy-server
      restart: always
      network_mode: "service:openvpn"

  # 2. SSH 通道建立者
  tunnel:
    build: ./tunnel # 指向 tunnel Dockerfile
    container_name: pi-tunnel-worker
    restart: always
    network_mode: "service:openvpn" # 寄生在 OpenVPN 網路下
    depends_on:
      - openvpn
      - proxy
    volumes:
      - ./keys/key-to-aws.pem:/key.pem:ro
    command: >
      /bin/sh -c "
      echo 'Waiting for VPN and proxy to be ready...' &&
      sleep 10 &&
      echo 'Starting SSH tunnel with autossh (will auto-reconnect)...' &&
      autossh -M 20000 -N \
      -o 'ServerAliveInterval 30' \
      -o 'ServerAliveCountMax 3' \
      -o 'StrictHostKeyChecking no' \
      -o 'ExitOnForwardFailure yes' \
      -o 'GatewayPorts yes' \
      -o 'TCPKeepAlive yes' \
      -o 'Compression no' \
      -o 'BatchMode yes' \
      -o 'ConnectTimeout 10' \
      -R 0.0.0.0:2080:127.0.0.1:1080
      -i /key.pem \
      ubuntu@172.31.67.145"