services:

  # OpenVPN 客戶端
  openvpn:
    image: alpine:latest
    container_name: pi-openvpn-client
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # 檔案不存在時直接報錯，不讓 Docker 自動建一個同名的空資料夾
      - type: bind
        source: ${OVPN_CONFIG_PATH}
        target: /etc/openvpn/client.conf
        bind:
          create_host_path: false
    command: >
      /bin/sh -c "apk add --no-cache openvpn && openvpn --config /etc/openvpn/client.conf"

  # SSH 反向通道建立者
  tunnel:
    build: ./tunnel
    container_name: pi-tunnel-worker
    restart: always
    network_mode: "service:openvpn"
    depends_on:
      - openvpn
    volumes:
      - type: bind
        source: ${SSH_KEY_PATH}
        target: /key.pem
        read_only: true
        bind:
          create_host_path: false
    command: >
      /bin/sh -c " sleep 10 && autossh -M 20000 -N \ -o 'StrictHostKeyChecking no' \ -o 'ExitOnForwardFailure yes' \ -R ${REMOTE_PORT}:127.0.0.1:${PROXY_PORT} \ -i /key.pem \ ${REMOTE_USER}@${REMOTE_HOST}"

  # HTTP/SOCKS4/SOCKS5 代理服務器 (pproxy)
  proxy:
    build: ./proxy
    container_name: pi-pproxy
    restart: always
    network_mode: "service:openvpn"
    tty: true
    stdin_open: true
    depends_on:
      - openvpn
    command: [ "pproxy", "-l", "http+socks4+socks5://:${PROXY_PORT}", "-vv" ]
