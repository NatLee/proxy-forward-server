services:

  # 持有 openvpn、tunnel、proxy 共用的網路，自己什麼都不做。
  # openvpn 重啟時這個網路還在，tunnel 和 proxy 不會卡在已經消失的網路裡，也就不用跟著重啟。
  netns:
    build: ./vpn
    container_name: pi-netns
    restart: always
    init: true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: [ "sleep", "infinity" ]

  # OpenVPN 客戶端
  openvpn:
    build: ./vpn
    container_name: pi-openvpn-client
    restart: always
    network_mode: "service:netns"
    depends_on:
      - netns
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      # 檔案不存在時直接報錯，不讓 Docker 自動建一個同名的空資料夾
      - type: bind
        source: ${OVPN_CONFIG_PATH}
        target: /etc/openvpn/client.conf
        bind:
          create_host_path: false

  # SSH 反向通道建立者
  tunnel:
    build: ./tunnel
    container_name: pi-tunnel-worker
    restart: always
    network_mode: "service:netns"
    depends_on:
      - netns
      - openvpn
    environment:
      # 連不上時一直重試，連第一次也一樣（例如 VPN 還沒連上）；重試間隔最多 30 秒
      AUTOSSH_GATETIME: "0"
      AUTOSSH_POLL: "30"
    volumes:
      - type: bind
        source: ${SSH_KEY_PATH}
        target: /key.pem
        read_only: true
        bind:
          create_host_path: false
    # 斷線偵測只靠 SSH 自己的 ServerAlive（10 秒問一次，30 秒沒回應就斷開重連），
    # 所以 autossh 用 -M 0，不另外占用監控埠。
    # 反向通道接到 127.0.0.1：proxy 跟 tunnel 在同一個網路裡（netns）。
    command:
      - autossh
      - -M
      - "0"
      - -N
      - -o
      - StrictHostKeyChecking no
      - -o
      - ExitOnForwardFailure yes
      - -o
      - ConnectTimeout 10
      - -o
      - ServerAliveInterval 10
      - -o
      - ServerAliveCountMax 3
      - -R
      - ${REMOTE_PORT}:127.0.0.1:${PROXY_PORT}
      - -i
      - /key.pem
      - ${REMOTE_USER}@${REMOTE_HOST}

  # HTTP/SOCKS4/SOCKS5 代理服務器 (pproxy)
  proxy:
    build: ./proxy
    container_name: pi-pproxy
    restart: always
    network_mode: "service:netns"
    depends_on:
      - netns
    # 聽的位址和埠：.env 有設就用 .env 的，沒設或留空就用 proxy/Dockerfile 的預設（只聽 127.0.0.1）。
    # PROXY_BIND=0.0.0.0 是舊版的行為（VPN 和 Docker 網路上的主機也能直接用，而且沒有帳密）。
    environment:
      - PROXY_BIND
      - PROXY_PORT
    # -vv：每個連線記一筆。詳細模式要讀終端機，所以開 tty。
    tty: true
    stdin_open: true
    command: [ "-vv" ]
