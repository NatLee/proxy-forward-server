name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check docker-compose.yml with the example settings
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build the images
        run: docker compose build

      - name: A missing .ovpn or SSH key stops compose with a clear error
        run: |
          # The .ovpn and key paths from .env.example don't exist on the runner.
          ovpn=$(sed -n "s/^OVPN_CONFIG_PATH=//p" .env.example)
          key=$(sed -n "s/^SSH_KEY_PATH=//p" .env.example)
          if out=$(docker compose up -d 2>&1); then status=0; else status=$?; fi
          docker compose down -t 1 >/dev/null 2>&1 || true
          echo "$out"
          test "$status" -ne 0
          echo "$out" | grep -q "bind source path does not exist"
          # ...and Docker must not have created empty folders in their place.
          test -n "$ovpn" && test ! -e "$ovpn"
          test -n "$key" && test ! -e "$key"

      - name: End-to-end test (throwaway VPN server + SSH host)
        # The runner is disposable, so the test may also restart the Docker daemon
        # to check that everything comes back after a reboot-like restart.
        env:
          E2E_RESTART_DOCKER: "1"
        run: sh tests/e2e/run.sh
